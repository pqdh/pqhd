name: reference

on:
  pull_request:
  push:
    branches: main

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test reference implementation, registry, and vectors
        working-directory: reference/python
        run: python -m unittest -v test_pqhd
